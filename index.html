<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lex · Stories Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .lh-widget * { font-family: 'Inter', sans-serif; }
        .lh-widget { position: fixed; bottom: 24px; right: 24px; z-index: 999999; }
        .lh-fab { cursor: pointer; position: relative; }
        .lh-fab-inner {
            width: 60px; height: 60px; background: #1e4a6e; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.25); border: 2px solid white;
            transition: 0.2s; color: white; font-weight: 700; font-size: 1.2rem; gap: 3px;
        }
        .lh-fab-inner i { font-size: 20px; color: #f5b042; }
        .lh-fab:hover .lh-fab-inner { transform: scale(1.05); background: #0f3b35; }
        .lh-badge {
            position: absolute; top: -6px; right: -6px; background: #ef4444; color: white;
            border-radius: 30px; padding: 2px 6px; font-size: 11px; font-weight: bold;
            min-width: 20px; text-align: center; box-shadow: 0 0 0 2px white;
        }
        .lh-pulse-ring {
            position: absolute; width: 72px; height: 72px; border-radius: 50%;
            background: rgba(30,74,110,0.4); top: -6px; left: -6px;
            animation: lh-pulse 1.8s infinite; pointer-events: none;
        }
        @keyframes lh-pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .lh-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 1000000; display: flex; align-items: center; justify-content: center;
            visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .lh-modal.active { visibility: visible; opacity: 1; }
        .lh-modal-card {
            background: white; width: 90%; max-width: 500px; max-height: 85vh;
            border-radius: 32px; overflow: hidden; display: flex; flex-direction: column;
        }
        .lh-modal-header {
            padding: 1rem 1.5rem; background: #f8fafc; border-bottom: 1px solid #eef2f6;
            display: flex; justify-content: space-between; align-items: center; font-weight: 600;
        }
        .lh-close-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: #5b6e8c; }
        .lh-modal-body { padding: 1rem; overflow-y: auto; flex: 1; }
        .lh-lawyers-grid { display: flex; flex-direction: column; gap: 12px; padding: 1rem; }
        .lh-lawyer-row {
            display: flex; align-items: center; gap: 14px; padding: 10px;
            background: white; border-radius: 60px; cursor: pointer;
            border: 1px solid #e2e8f0; transition: 0.1s;
        }
        .lh-lawyer-row:hover { background: #f1f5f9; }
        .lh-avatar { position: relative; width: 56px; height: 56px; }
        .lh-avatar-circle {
            width: 56px; height: 56px; background: #1f5e54; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 1.2rem; text-transform: uppercase;
        }
        .lh-story-ring {
            position: absolute; top: -2px; left: -2px; width: 60px; height: 60px;
            border-radius: 50%; border: 2px solid #cbd5e1; pointer-events: none;
        }
        .lh-story-ring.has-updates { border-color: #25D366; box-shadow: 0 0 0 2px #e6f7ef; }
        .lh-lawyer-name { font-weight: 600; flex: 1; font-size: 1rem; }
        .lh-update-count { background: #eef2ff; padding: 2px 10px; border-radius: 30px; font-size: 0.75rem; }
        .lh-carousel {
            position: relative; flex: 1; display: flex; flex-direction: column;
            background: #0f172a; min-height: 400px;
        }
        .lh-carousel-slide {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 2rem; text-align: center; color: white;
            gap: 20px; overflow-y: auto;
        }
        .lh-carousel-slide img { max-width: 100%; max-height: 300px; border-radius: 16px; object-fit: contain; }
        .lh-carousel-slide iframe { width: 100%; height: 220px; border-radius: 16px; }
        .lh-carousel-slide video { max-width: 100%; max-height: 300px; border-radius: 16px; }
        .lh-story-text { font-size: 1.2rem; line-height: 1.4; }
        .lh-update-meta { font-size: 0.7rem; opacity: 0.6; margin-top: 12px; }
        .lh-progress-container {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; gap: 4px; padding: 8px 12px; z-index: 20;
            background: rgba(0,0,0,0.3);
        }
        .lh-progress-segment { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; }
        .lh-progress-fill { height: 100%; width: 0%; background: white; transition: width 0.05s linear; }
        .lh-click-zones { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; z-index: 15; }
        .lh-click-left, .lh-click-right { flex: 1; cursor: pointer; }
        .lh-pause-indicator {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); border-radius: 40px; padding: 6px 14px;
            font-size: 0.75rem; color: white; pointer-events: none; z-index: 20;
            opacity: 0; transition: opacity 0.2s;
        }
        .lh-pause-indicator.visible { opacity: 1; }
    </style>
</head>
<body>
<div id="lex-widget-root"></div>
<script>
    (function() {
        // ================= CONFIGURATION =================
        const GITHUB_OWNER = "hunter9201";      // CHANGE TO YOUR USERNAME
        const GITHUB_REPO = "I";                // CHANGE TO YOUR REPO
        const GITHUB_BRANCH = "main";
        const DATA_JSON_PATH = "lex_data.json";
        const EXPIRY_HOURS = 48;
        const AUTO_SLIDE_INTERVAL = 5000;
        const POLL_INTERVAL = 30000;

        let allLawyers = [];
        let allUpdates = [];
        let currentLawyerUpdates = [];
        let currentIndex = 0;
        let autoTimer = null;
        let isPaused = false;
        let progressInterval = null;
        let progressStartTime = 0;
        let progressContainer = null;
        let pauseIndicator = null;
        let modal = null;

        async function fetchData() {
            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_JSON_PATH}?ref=${GITHUB_BRANCH}`;
            try {
                const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
                if (res.status === 404) return null;
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                const content = atob(json.content);
                return JSON.parse(content);
            } catch (err) {
                console.error("Fetch error:", err);
                return null;
            }
        }

        function filterExpiredUpdates(updatesArray) {
            const now = Date.now();
            let changed = false;
            for (let lu of updatesArray) {
                const originalLen = lu.updates.length;
                lu.updates = lu.updates.filter(up => new Date(up.expiresAt).getTime() > now);
                if (lu.updates.length !== originalLen) changed = true;
            }
            return changed;
        }

        async function loadData() {
            const data = await fetchData();
            if (data && Array.isArray(data.lawyers) && Array.isArray(data.updates)) {
                allLawyers = data.lawyers;
                allUpdates = data.updates;
            } else {
                allLawyers = [];
                allUpdates = [];
            }
            for (let lawyer of allLawyers) {
                if (!allUpdates.find(lu => lu.lawyerId === lawyer.id)) {
                    allUpdates.push({ lawyerId: lawyer.id, updates: [] });
                }
            }
            filterExpiredUpdates(allUpdates);
            updateFloatingBadge();
            if (modal && modal.main && modal.main.classList.contains("active")) renderLawyerList();
        }

        function totalActiveUpdates() {
            return allUpdates.reduce((sum, lu) => sum + lu.updates.length, 0);
        }

        function updateFloatingBadge() {
            const badge = document.getElementById("lexBadge");
            if (badge) {
                const count = totalActiveUpdates();
                badge.style.display = count > 0 ? "block" : "none";
                if (count > 0) badge.textContent = count;
            }
        }

        // ================= CAROUSEL AUTO-SLIDE =================
        function stopAutoSlide() {
            if (autoTimer) clearTimeout(autoTimer);
            if (progressInterval) clearInterval(progressInterval);
            autoTimer = null;
            progressInterval = null;
        }

        function startAutoSlide() {
            if (isPaused) return;
            stopAutoSlide();
            updateProgressBar(0);
            progressStartTime = Date.now();
            progressInterval = setInterval(() => {
                if (isPaused) return;
                const elapsed = Date.now() - progressStartTime;
                const percent = Math.min(100, (elapsed / AUTO_SLIDE_INTERVAL) * 100);
                updateProgressBar(percent);
                if (percent >= 100) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                    nextSlide();
                }
            }, 50);
            autoTimer = setTimeout(() => {
                if (!isPaused) nextSlide();
            }, AUTO_SLIDE_INTERVAL);
        }

        function updateProgressBar(percent) {
            if (!progressContainer) return;
            const segments = progressContainer.querySelectorAll('.lh-progress-fill');
            if (segments[currentIndex]) segments[currentIndex].style.width = percent + '%';
        }

        function resetProgressBarForSlide() {
            if (!progressContainer) return;
            const segments = progressContainer.querySelectorAll('.lh-progress-fill');
            for (let i = 0; i < segments.length; i++) {
                segments[i].style.width = (i < currentIndex) ? '100%' : (i === currentIndex ? '0%' : '0%');
            }
            if (!isPaused) startAutoSlide();
        }

        function renderCurrentSlide(update) {
            const slideContainer = document.getElementById("lhCarouselSlide");
            if (!slideContainer) return;
            let mediaHtml = "";
            if (update.type === "image" && update.mediaUrl) {
                mediaHtml = `<img src="${escapeHtml(update.mediaUrl)}" alt="update">`;
            } else if (update.type === "video" && update.mediaUrl) {
                let videoUrl = update.mediaUrl;
                // Check if it's a YouTube URL
                if (videoUrl.includes("youtube.com/watch?v=") || videoUrl.includes("youtu.be/")) {
                    let embedUrl = "";
                    if (videoUrl.includes("youtube.com/watch?v=")) {
                        let vid = videoUrl.split("v=")[1]?.split("&")[0];
                        embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&playsinline=1`;
                    } else if (videoUrl.includes("youtu.be/")) {
                        let vid = videoUrl.split("/").pop().split("?")[0];
                        embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&playsinline=1`;
                    }
                    mediaHtml = `<iframe src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                } else {
                    // Direct video file (uploaded to GitHub) – add autoplay muted
                    mediaHtml = `<video controls autoplay muted playsinline style="max-width:100%; max-height:300px; border-radius:16px;"><source src="${escapeHtml(videoUrl)}" type="video/mp4">Your browser does not support video.</video>`;
                }
            } else if (update.type === "article" && update.mediaUrl) {
                mediaHtml = `<div><i class="fas fa-newspaper"></i> <a href="${escapeHtml(update.mediaUrl)}" target="_blank" style="color:#f5b042;">Read full article →</a></div>`;
            }
            const date = new Date(update.timestamp).toLocaleString();
            slideContainer.innerHTML = `
                <div class="lh-carousel-slide">
                    ${update.type === "text" ? `<div class="lh-story-text">${escapeHtml(update.content)}</div>` : `<div><strong>${escapeHtml(update.content)}</strong></div>`}
                    ${mediaHtml}
                    <div class="lh-update-meta">${date}</div>
                </div>
            `;
            const slideDiv = slideContainer.querySelector('.lh-carousel-slide');
            if (slideDiv) slideDiv.onclick = (e) => { e.stopPropagation(); togglePause(); };
            
            // For videos that are not YouTube, ensure they start playing if autoplay fails (due to browser policy)
            if (update.type === "video" && !update.mediaUrl.includes("youtube")) {
                const video = slideContainer.querySelector('video');
                if (video) {
                    video.play().catch(e => console.log("Autoplay prevented, user can tap to play"));
                }
            }
        }

        function showSlide(index) {
            if (!currentLawyerUpdates.length) return;
            if (index < 0) index = 0;
            if (index >= currentLawyerUpdates.length) {
                closeCarouselModal();
                return;
            }
            currentIndex = index;
            renderCurrentSlide(currentLawyerUpdates[currentIndex]);
            resetProgressBarForSlide();
        }

        function nextSlide() {
            if (currentIndex + 1 < currentLawyerUpdates.length) showSlide(currentIndex + 1);
            else closeCarouselModal();
        }

        function prevSlide() {
            if (currentIndex - 1 >= 0) showSlide(currentIndex - 1);
        }

        function pauseSlideShow() {
            if (isPaused) return;
            isPaused = true;
            stopAutoSlide();
            if (pauseIndicator) pauseIndicator.classList.add("visible");
            setTimeout(() => { if (pauseIndicator) pauseIndicator.classList.remove("visible"); }, 1500);
        }

        function resumeSlideShow() {
            if (!isPaused) return;
            isPaused = false;
            startAutoSlide();
        }

        function togglePause() {
            if (isPaused) resumeSlideShow();
            else pauseSlideShow();
        }

        function buildCarouselUI(lawyerName, updatesArray) {
            currentLawyerUpdates = updatesArray;
            currentIndex = 0;
            const carouselBody = document.getElementById("carouselBody");
            const headerTitle = document.getElementById("carouselTitle");
            if (headerTitle) headerTitle.innerText = `${lawyerName} · Stories`;
            carouselBody.innerHTML = `
                <div class="lh-progress-container" id="lhProgressContainer">
                    ${updatesArray.map(() => `<div class="lh-progress-segment"><div class="lh-progress-fill"></div></div>`).join('')}
                </div>
                <div id="lhCarouselSlide" style="flex:1; display:flex; flex-direction:column;"></div>
            `;
            progressContainer = document.getElementById("lhProgressContainer");
            const carouselDiv = carouselBody.closest('.lh-carousel');
            if (carouselDiv && !carouselDiv.querySelector('.lh-click-zones')) {
                const zones = document.createElement('div');
                zones.className = 'lh-click-zones';
                zones.innerHTML = `<div class="lh-click-left"></div><div class="lh-click-right"></div>`;
                carouselDiv.appendChild(zones);
                zones.querySelector('.lh-click-left').addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });
                zones.querySelector('.lh-click-right').addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
            }
            if (carouselDiv && !carouselDiv.querySelector('.lh-pause-indicator')) {
                const ind = document.createElement('div');
                ind.className = 'lh-pause-indicator';
                ind.innerText = '⏸ Paused · tap to resume';
                carouselDiv.appendChild(ind);
                pauseIndicator = ind;
            }
            renderCurrentSlide(updatesArray[0]);
            resetProgressBarForSlide();
        }

        // ================= UI =================
        function createWidget() {
            const root = document.getElementById("lex-widget-root");
            if (!root) return;
            root.innerHTML = `
                <div class="lh-widget">
                    <div class="lh-fab" id="lexFab">
                        <div class="lh-pulse-ring"></div>
                        <div class="lh-fab-inner"><i class="fas fa-gavel"></i> Lex</div>
                        <div id="lexBadge" class="lh-badge" style="display:none;">0</div>
                    </div>
                    <div id="lexMainModal" class="lh-modal">
                        <div class="lh-modal-card">
                            <div class="lh-modal-header">
                                <span><i class="fas fa-gavel"></i> Lawyer Stories</span>
                                <button class="lh-close-btn" id="closeMainModal">&times;</button>
                            </div>
                            <div id="mainModalBody" class="lh-modal-body"></div>
                        </div>
                    </div>
                    <div id="lexCarouselModal" class="lh-modal">
                        <div class="lh-modal-card" style="background:#0f172a;">
                            <div class="lh-modal-header" style="background:rgba(0,0,0,0.5); color:white;">
                                <span id="carouselTitle">Stories</span>
                                <button class="lh-close-btn" id="closeCarouselModal" style="color:white;">&times;</button>
                            </div>
                            <div id="carouselBody" class="lh-carousel" style="flex:1; position:relative;"></div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("lexFab").addEventListener("click", openMainModal);
            document.getElementById("closeMainModal").addEventListener("click", closeMainModal);
            document.getElementById("closeCarouselModal").addEventListener("click", closeCarouselModal);
            modal = { main: document.getElementById("lexMainModal"), carousel: document.getElementById("lexCarouselModal") };
        }

        function openMainModal() {
            renderLawyerList();
            modal.main.classList.add("active");
        }
        function closeMainModal() { modal.main.classList.remove("active"); }
        function closeCarouselModal() {
            if (modal.carousel.classList.contains("active")) {
                stopAutoSlide();
                isPaused = false;
                modal.carousel.classList.remove("active");
            }
        }

        function renderLawyerList() {
            const body = document.getElementById("mainModalBody");
            if (!body) return;
            if (allLawyers.length === 0) {
                body.innerHTML = `<div style="padding:2rem; text-align:center;">No lawyers yet. Create profiles in the admin panel.</div>`;
                return;
            }
            let html = `<div class="lh-lawyers-grid">`;
            for (let lawyer of allLawyers) {
                const lawyerUpdates = allUpdates.find(lu => lu.lawyerId === lawyer.id);
                const updateCount = lawyerUpdates ? lawyerUpdates.updates.length : 0;
                const hasUpdates = updateCount > 0;
                html += `
                    <div class="lh-lawyer-row" data-id="${lawyer.id}">
                        <div class="lh-avatar">
                            <div class="lh-avatar-circle">${escapeHtml(lawyer.initials)}</div>
                            <div class="lh-story-ring ${hasUpdates ? 'has-updates' : ''}"></div>
                        </div>
                        <div class="lh-lawyer-name">${escapeHtml(lawyer.name)}</div>
                        ${updateCount > 0 ? `<div class="lh-update-count">${updateCount}</div>` : ''}
                    </div>
                `;
            }
            html += `</div>`;
            body.innerHTML = html;

            document.querySelectorAll(".lh-lawyer-row").forEach(row => {
                row.addEventListener("click", (e) => {
                    const id = parseInt(row.dataset.id);
                    showLawyerUpdates(id);
                });
            });
        }

        function showLawyerUpdates(lawyerId) {
            const lawyer = allLawyers.find(l => l.id === lawyerId);
            if (!lawyer) return;
            const lawyerUpdates = allUpdates.find(lu => lu.lawyerId === lawyerId);
            if (!lawyerUpdates || lawyerUpdates.updates.length === 0) {
                alert("No active updates for this lawyer.");
                return;
            }
            const updatesSorted = [...lawyerUpdates.updates].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            buildCarouselUI(lawyer.name, updatesSorted);
            modal.carousel.classList.add("active");
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function refresh() {
            await loadData();
            if (modal && modal.main && modal.main.classList.contains("active")) renderLawyerList();
        }
        setInterval(refresh, POLL_INTERVAL);
        refresh().then(() => createWidget());
    })();
</script>
</body>
</html>
