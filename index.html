<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lex · Stories — Auto‑open Full Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* FULL SCREEN STORIES MODAL — WhatsApp style, takes over immediately */
        .lh-stories-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 1000000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .lh-stories-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .lh-stories-container {
            width: 100%;
            height: 100%;
            background: #0a0c10;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Story header (lawyer info) */
        .lh-story-header {
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 60px;
            width: fit-content;
            max-width: 75%;
            pointer-events: none;
        }
        .lh-story-avatar {
            width: 40px;
            height: 40px;
            background: #1f5e54;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .lh-story-author {
            font-weight: 600;
            color: white;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
            text-shadow: 0 1px 1px black;
        }
        .lh-story-time {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-left: 8px;
        }
        .lh-close-story {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            font-size: 26px;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            transition: 0.2s;
        }
        .lh-close-story:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Progress bars (WhatsApp style top) */
        .lh-progress-strip {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 25;
        }
        .lh-progress-segment {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.4);
            border-radius: 4px;
            overflow: hidden;
        }
        .lh-progress-fill {
            height: 100%;
            width: 0%;
            background: white;
            transition: width 0.05s linear;
        }

        /* Slide content - full screen immersive */
        .lh-story-slide {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 80px 20px 40px 20px;
            text-align: center;
            color: white;
            background: radial-gradient(circle at 30% 20%, rgba(25, 55, 70, 0.7), #000000cc);
            overflow-y: auto;
        }
        .lh-story-slide img {
            max-width: 92%;
            max-height: 70vh;
            border-radius: 28px;
            object-fit: contain;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
        }
        .lh-story-slide video, 
        .lh-story-slide iframe {
            max-width: 95%;
            max-height: 65vh;
            border-radius: 28px;
            background: #000;
            border: none;
        }
        .lh-story-text {
            font-size: 1.7rem;
            line-height: 1.4;
            font-weight: 500;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
            max-width: 90%;
            word-break: break-word;
            margin-bottom: 20px;
        }
        .lh-story-text-small {
            font-size: 1.2rem;
        }
        .lh-article-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #1e4a6e;
            padding: 12px 24px;
            border-radius: 60px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 20px;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .lh-article-link:hover {
            background: #0f3b35;
            transform: scale(1.02);
        }
        .lh-update-meta {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 16px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
        }

        /* Click zones (left/right navigation) */
        .lh-click-zones {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            z-index: 15;
        }
        .lh-click-left, .lh-click-right {
            flex: 1;
            cursor: pointer;
            height: 100%;
        }
        .lh-pause-indicator {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 0.8rem;
            color: white;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.2s;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }
        .lh-pause-indicator.visible { opacity: 1; }

        /* No stories fallback */
        .lh-no-stories {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0c10;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000000;
            color: white;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 2rem;
        }
        .lh-no-stories-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2rem;
            max-width: 80%;
        }
    </style>
</head>
<body>
<div id="lex-widget-root"></div>
<script>
    (function() {
        // ========== CONFIGURATION (matching admin panel) ==========
        const GITHUB_OWNER = "hunter9201";      // CHANGE TO YOUR GITHUB USERNAME
        const GITHUB_REPO = "I";                // CHANGE TO YOUR REPO
        const GITHUB_BRANCH = "main";
        const DATA_JSON_PATH = "lex_data.json";
        const AUTO_SLIDE_INTERVAL = 5500;  // 5.5 sec per story (WhatsApp style)
        const POLL_INTERVAL = 30000;
        const MAX_RETRIES = 3;

        let allLawyers = [];
        let allUpdates = [];
        let globalStoryQueue = [];      // flat array of active stories across lawyers
        let currentStoryIndex = 0;
        let autoTimer = null;
        let progressInterval = null;
        let isPaused = false;
        let progressStartTime = 0;
        let activeModal = null;
        let pauseIndicatorElem = null;

        // ----- fetch & data helpers -----
        async function fetchDataWithRetry(retries = MAX_RETRIES) {
            const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${DATA_JSON_PATH}`;
            for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    if (res.status === 404) {
                        console.warn(`Attempt ${attempt}: lex_data.json not found (404).`);
                        if (attempt === retries) return null;
                        continue;
                    }
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    console.log("✅ Lex stories data loaded:", data);
                    return data;
                } catch (err) {
                    console.warn(`Attempt ${attempt} failed:`, err);
                    if (attempt === retries) throw err;
                    await new Promise(r => setTimeout(r, 1000 * attempt));
                }
            }
            return null;
        }

        async function loadData() {
            let data = null;
            let fetchErrorFlag = false;
            try {
                data = await fetchDataWithRetry();
            } catch (err) {
                console.error("GitHub fetch error:", err);
                fetchErrorFlag = true;
            }

            if (data && Array.isArray(data.lawyers) && Array.isArray(data.updates)) {
                allLawyers = data.lawyers;
                allUpdates = data.updates;
                console.log(`📋 ${allLawyers.length} lawyers, raw updates count: ${allUpdates.reduce((s,lu)=> s + (lu.updates?.length||0),0)}`);
            } else {
                allLawyers = [];
                allUpdates = [];
                if (!fetchErrorFlag) console.warn("Invalid data structure or missing file.");
            }

            // Ensure each lawyer has an updates entry
            for (let lawyer of allLawyers) {
                if (!allUpdates.find(lu => lu.lawyerId === lawyer.id)) {
                    allUpdates.push({ lawyerId: lawyer.id, updates: [] });
                }
            }
            // Remove expired updates (based on expiresAt)
            const now = Date.now();
            for (let lu of allUpdates) {
                lu.updates = (lu.updates || []).filter(up => new Date(up.expiresAt).getTime() > now);
            }

            rebuildGlobalStoryQueue();   // refresh queue for auto-open
        }

        function rebuildGlobalStoryQueue() {
            const stories = [];
            for (let lawyer of allLawyers) {
                const lawyerUpdatesEntry = allUpdates.find(lu => lu.lawyerId === lawyer.id);
                if (!lawyerUpdatesEntry || !lawyerUpdatesEntry.updates.length) continue;
                for (let update of lawyerUpdatesEntry.updates) {
                    stories.push({
                        ...update,
                        lawyerId: lawyer.id,
                        lawyerName: lawyer.name,
                        lawyerInitials: lawyer.initials || lawyer.name.slice(0,2).toUpperCase(),
                        timestamp: update.timestamp
                    });
                }
            }
            // sort newest first (WhatsApp style)
            stories.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            globalStoryQueue = stories;
            console.log(`📖 Story queue rebuilt: ${globalStoryQueue.length} active stories`);
        }

        // ----- FULL SCREEN STORIES CAROUSEL (WhatsApp like) -----
        function stopSlideTimer() {
            if (autoTimer) clearTimeout(autoTimer);
            if (progressInterval) clearInterval(progressInterval);
            autoTimer = null;
            progressInterval = null;
        }

        function updateProgressBar(percent) {
            if (!activeModal) return;
            const progressContainer = activeModal.querySelector('#storyProgressContainer');
            if (!progressContainer) return;
            const segments = progressContainer.querySelectorAll('.lh-progress-fill');
            if (segments[currentStoryIndex]) {
                segments[currentStoryIndex].style.width = percent + '%';
            }
        }

        function startAutoSlide() {
            if (isPaused) return;
            stopSlideTimer();
            if (!globalStoryQueue.length) return;
            updateProgressBar(0);
            progressStartTime = Date.now();
            progressInterval = setInterval(() => {
                if (isPaused) return;
                const elapsed = Date.now() - progressStartTime;
                const percent = Math.min(100, (elapsed / AUTO_SLIDE_INTERVAL) * 100);
                updateProgressBar(percent);
                if (percent >= 100) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                    nextStory();
                }
            }, 40);
            autoTimer = setTimeout(() => {
                if (!isPaused) nextStory();
            }, AUTO_SLIDE_INTERVAL);
        }

        function resetProgressForIndex() {
            if (!activeModal) return;
            const progressContainer = activeModal.querySelector('#storyProgressContainer');
            if (!progressContainer) return;
            const segments = progressContainer.querySelectorAll('.lh-progress-fill');
            for (let i = 0; i < segments.length; i++) {
                segments[i].style.width = (i < currentStoryIndex) ? '100%' : (i === currentStoryIndex ? '0%' : '0%');
            }
            if (!isPaused) startAutoSlide();
        }

        function renderCurrentStory(story) {
            if (!activeModal) return;
            const slideContainer = activeModal.querySelector('#storySlideContent');
            if (!slideContainer) return;
            
            let mediaHtml = "";
            const contentHtml = story.type === "text" 
                ? `<div class="lh-story-text">${escapeHtml(story.content)}</div>` 
                : `<div class="lh-story-text lh-story-text-small">${escapeHtml(story.content)}</div>`;
            
            if (story.type === "image" && story.mediaUrl) {
                mediaHtml = `<img src="${escapeHtml(story.mediaUrl)}" alt="story update" loading="lazy">`;
            } else if (story.type === "video" && story.mediaUrl) {
                let videoUrl = story.mediaUrl;
                if (videoUrl.includes("youtube.com/watch?v=") || videoUrl.includes("youtu.be/")) {
                    let embedUrl = "";
                    if (videoUrl.includes("youtube.com/watch?v=")) {
                        let vid = videoUrl.split("v=")[1]?.split("&")[0];
                        embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&playsinline=1`;
                    } else if (videoUrl.includes("youtu.be/")) {
                        let vid = videoUrl.split("/").pop().split("?")[0];
                        embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&playsinline=1`;
                    }
                    mediaHtml = `<iframe src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:90%; height:55vh; border-radius:28px;"></iframe>`;
                } else {
                    mediaHtml = `<video controls autoplay muted playsinline style="max-width:95%; max-height:65vh; border-radius:28px;"><source src="${escapeHtml(videoUrl)}" type="video/mp4">Your browser does not support video.</video>`;
                }
            } else if (story.type === "article" && story.mediaUrl) {
                mediaHtml = `<a href="${escapeHtml(story.mediaUrl)}" target="_blank" class="lh-article-link"><i class="fas fa-newspaper"></i> Read full article →</a>`;
            }
            
            const formattedDate = new Date(story.timestamp).toLocaleString(undefined, { hour:'2-digit', minute:'2-digit', day:'numeric', month:'short' });
            slideContainer.innerHTML = `
                <div class="lh-story-slide">
                    ${contentHtml}
                    ${mediaHtml}
                    <div class="lh-update-meta"><i class="far fa-clock"></i> ${formattedDate}</div>
                </div>
            `;
            // update header info
            const headerNameSpan = activeModal.querySelector('#storyHeaderLawyer');
            const headerAvatar = activeModal.querySelector('#storyHeaderAvatar');
            if (headerNameSpan) headerNameSpan.innerText = story.lawyerName || "Advocate";
            if (headerAvatar) headerAvatar.innerText = (story.lawyerInitials || story.lawyerName?.slice(0,2) || "LX").toUpperCase();
            
            // autoplay video if needed
            const videoElem = slideContainer.querySelector('video');
            if (videoElem && story.type === "video" && !story.mediaUrl.includes("youtube")) {
                videoElem.play().catch(e => console.log("autoplay blocked", e));
            }
        }

        function showStoryAtIndex(index) {
            if (!globalStoryQueue.length) {
                closeStoriesModal();
                return;
            }
            if (index < 0) index = 0;
            if (index >= globalStoryQueue.length) {
                closeStoriesModal();   // end of stories
                return;
            }
            currentStoryIndex = index;
            const story = globalStoryQueue[currentStoryIndex];
            renderCurrentStory(story);
            resetProgressForIndex();
        }

        function nextStory() {
            if (currentStoryIndex + 1 < globalStoryQueue.length) {
                showStoryAtIndex(currentStoryIndex + 1);
            } else {
                closeStoriesModal();   // finished all stories
            }
        }

        function prevStory() {
            if (currentStoryIndex - 1 >= 0) {
                showStoryAtIndex(currentStoryIndex - 1);
            }
        }

        function pauseStory() {
            if (isPaused) return;
            isPaused = true;
            stopSlideTimer();
            if (pauseIndicatorElem) {
                pauseIndicatorElem.classList.add("visible");
                setTimeout(() => {
                    if (pauseIndicatorElem) pauseIndicatorElem.classList.remove("visible");
                }, 1200);
            }
        }

        function resumeStory() {
            if (!isPaused) return;
            isPaused = false;
            startAutoSlide();
        }

        function togglePause() {
            if (isPaused) resumeStory();
            else pauseStory();
        }

        // Build full-screen stories modal (WhatsApp style)
        function buildFullscreenStoriesUI(storiesArray) {
            if (!storiesArray.length) return null;
            const modal = document.createElement('div');
            modal.className = 'lh-stories-modal';
            modal.id = 'dynamicStoriesModal';
            modal.innerHTML = `
                <div class="lh-stories-container">
                    <div class="lh-progress-strip" id="storyProgressContainer">
                        ${storiesArray.map(() => `<div class="lh-progress-segment"><div class="lh-progress-fill"></div></div>`).join('')}
                    </div>
                    <div class="lh-story-header">
                        <div class="lh-story-avatar" id="storyHeaderAvatar">LX</div>
                        <div class="lh-story-author">
                            <span id="storyHeaderLawyer">Lawyer</span>
                        </div>
                    </div>
                    <button class="lh-close-story" id="lhCloseStoryBtn"><i class="fas fa-times"></i></button>
                    <div id="storySlideContent" style="flex:1; display:flex; flex-direction:column;"></div>
                    <div class="lh-click-zones">
                        <div class="lh-click-left"></div>
                        <div class="lh-click-right"></div>
                    </div>
                    <div class="lh-pause-indicator" id="pauseIndicatorStory">⏸ Paused · tap to resume</div>
                </div>
            `;
            document.body.appendChild(modal);
            activeModal = modal;
            pauseIndicatorElem = modal.querySelector('#pauseIndicatorStory');
            
            // event listeners
            const leftZone = modal.querySelector('.lh-click-left');
            const rightZone = modal.querySelector('.lh-click-right');
            const closeBtn = modal.querySelector('#lhCloseStoryBtn');
            leftZone.addEventListener('click', (e) => { e.stopPropagation(); prevStory(); });
            rightZone.addEventListener('click', (e) => { e.stopPropagation(); nextStory(); });
            closeBtn.addEventListener('click', () => closeStoriesModal());
            const slideArea = modal.querySelector('#storySlideContent');
            if (slideArea) slideArea.addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
            return modal;
        }

        function closeStoriesModal() {
            if (activeModal) {
                stopSlideTimer();
                isPaused = false;
                if (activeModal.parentNode) activeModal.parentNode.removeChild(activeModal);
                activeModal = null;
                pauseIndicatorElem = null;
                currentStoryIndex = 0;
            }
        }

        // ----- AUTO-OPEN STORIES (no FAB, immediate) -----
        async function openGlobalStories() {
            rebuildGlobalStoryQueue();   // ensure latest queue
            
            if (!globalStoryQueue.length) {
                // Show friendly "no stories" message and optionally retry after poll
                const noStoryDiv = document.createElement('div');
                noStoryDiv.className = 'lh-no-stories';
                noStoryDiv.id = 'noStoriesFallback';
                noStoryDiv.innerHTML = `
                    <div class="lh-no-stories-card">
                        <i class="fas fa-newspaper" style="font-size: 3rem; color: #f5b042; margin-bottom: 1rem; display: block;"></i>
                        <h2>No active stories</h2>
                        <p style="margin-top: 0.5rem; opacity:0.8;">There are no lawyer stories available right now.<br>Check back later for updates.</p>
                        <button id="retryStoriesBtn" style="margin-top: 1.5rem; background: #1e4a6e; border: none; color: white; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: 500;">↻ Refresh</button>
                    </div>
                `;
                document.body.appendChild(noStoryDiv);
                const retryBtn = document.getElementById('retryStoriesBtn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', async () => {
                        await refreshAndUpdate();
                        if (globalStoryQueue.length > 0) {
                            if (noStoryDiv) noStoryDiv.remove();
                            openGlobalStories();  // retry opening stories
                        } else {
                            // still none, keep message but update text
                            const msgDiv = noStoryDiv.querySelector('p');
                            if (msgDiv) msgDiv.innerHTML = 'Still no active stories.<br>Add updates via Lex Admin Panel.';
                        }
                    });
                }
                return;
            }
            
            // remove any leftover no-stories overlay
            const existingNoStory = document.getElementById('noStoriesFallback');
            if (existingNoStory) existingNoStory.remove();
            
            if (activeModal) closeStoriesModal();
            const modalUI = buildFullscreenStoriesUI(globalStoryQueue);
            if (!modalUI) return;
            activeModal = modalUI;
            currentStoryIndex = 0;
            const firstStory = globalStoryQueue[0];
            if (firstStory) {
                renderCurrentStory(firstStory);
                resetProgressForIndex();
            }
            modalUI.classList.add('active');
            startAutoSlide();
        }

        // ----- polling and initialisation -----
        async function refreshAndUpdate() {
            await loadData();          // updates allLawyers, allUpdates, expires, rebuilds queue internally
            // if modal is not open and we have stories? not needed, but keep badge not used (removed FAB)
            // but we also need to check if we should automatically open on initial load
        }

        // Escape helper
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ----- START: auto-load and open stories immediately -----
        (async function init() {
            // load data first
            await refreshAndUpdate();
            // After initial data fetch, immediately open the stories modal (if any stories exist)
            // If no stories, openGlobalStories will show placeholder with retry
            await openGlobalStories();
            
            // Set up periodic polling to refresh stories in background
            setInterval(async () => {
                await refreshAndUpdate();
                // If the stories modal is currently open, we do NOT force-reload it (would be disruptive)
                // But if it's closed and new stories arrive, nothing auto-opens (user might refresh page)
                // However if the modal is closed and we have stories, we don't auto-open again after initial.
                // But we can optionally update the queue for next time user opens? but we removed FAB.
                // For simplicity: if no modal active and we have stories after poll, we don't disturb.
                // But we also update the "no stories" overlay if it exists and stories appear.
                const noStoryOverlay = document.getElementById('noStoriesFallback');
                if (noStoryOverlay && globalStoryQueue.length > 0) {
                    noStoryOverlay.remove();
                    // automatically open stories when they appear after being empty
                    await openGlobalStories();
                }
            }, POLL_INTERVAL);
        })();
    })();
</script>
</body>
</html>
